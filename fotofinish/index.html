<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Fotofinish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Fotofinish: avond in de wijnbar. Bijna zwart, crème, wijnrood, wijngaardgroen, messing */
  :root {
    --bg: #141210;
    --panel: #1e1b18;
    --panel-2: #29251f;
    --line: #3b352d;
    --cream: #f0e4c8;
    --wire: #a8a193;
    --red: #d2382d;
    --green: #22975b;
    --brass: #d4ab45;
    --bronze: #c98f5a;
    --ink: #141210;
    --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  b, strong { font-weight: 800; }

  /* ── GEDEELD ── */
  .mark {
    width: 1.05em; height: 1.05em; border-radius: 50%; flex: none; display: inline-block;
    /* een glas rode wijn van bovenaf */
    background: radial-gradient(circle at 42% 40%, #e2584c 0 18%, var(--red) 34%, #7d1d22 70%);
    box-shadow: 0 0 0 .09em var(--bg), 0 0 0 .17em var(--cream);
  }
  .brand {
    display: flex; align-items: center; gap: .5em;
    font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .04em;
  }
  .display {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    line-height: .92; letter-spacing: .01em; margin: 0; text-wrap: balance;
  }
  .meta {
    font-family: var(--display); font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: var(--brass); margin: 0;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4em;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--cream);
    border-radius: 10px; padding: .55em 1em; font-weight: 700; text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--wire); }
  .btn.primary { background: var(--cream); color: var(--ink); border-color: var(--cream); font-weight: 800; }
  .btn.primary:hover { background: #fff; }
  .btn.big { font-size: 1.15em; padding: .8em 1.2em; border-radius: 14px; width: 100%; }
  .dot { width: .7em; height: .7em; border-radius: 50%; background: var(--wire); display: inline-block; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 .22em rgba(34, 151, 91, .25); }
  .dot.wait { background: var(--brass); animation: blink 1s infinite; }
  .dot.off, .dot.nolib { background: var(--red); }
  @keyframes blink { 50% { opacity: .3; } }
  input[type=text], input[type=number], textarea, select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: .6em .8em; width: 100%; min-width: 0;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--cream); outline: none; }
  textarea { min-height: 4.6em; resize: vertical; }
  .toast {
    position: fixed; left: 50%; bottom: calc(1.2em + env(safe-area-inset-bottom, 0px)); z-index: 50;
    transform: translate(-50%, 1em); opacity: 0; pointer-events: none;
    background: var(--cream); color: var(--ink); font-weight: 700;
    padding: .7em 1.1em; border-radius: 12px; transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* antwoordkleuren: rood ●, groen ▲, crème ■, messing ◆ */
  .t0 { background: var(--red); color: #fff; }
  .t1 { background: var(--green); color: #fff; }
  .t2 { background: var(--cream); color: var(--ink); }
  .t3 { background: var(--brass); color: var(--ink); }

  /* ── LANDING ── */
  .landing {
    min-height: 100dvh; max-width: 30em; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: center; gap: 1.4em;
    padding-block: 2em;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .landing .brand { font-size: 3.4em; }
  .landing .lede { color: var(--wire); font-size: 1.15em; margin: 0; }
  .landing form { display: grid; gap: .7em; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.1em; }
  .landing label { font-weight: 700; }
  .landing #code { font-family: var(--display); font-size: 2em; font-weight: 900; text-align: center; letter-spacing: .14em; text-transform: uppercase; }

  /* ── QUIZMASTER / BEAMER ── */
  .host {
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    font-size: clamp(14px, 1.12vw, 24px);
  }
  .hbar {
    display: flex; align-items: center; gap: 1.2em;
    padding: .7em 1.6em; border-bottom: 1px solid var(--line);
  }
  .hbar .brand { font-size: 1.7em; }
  .hbar .count { font-family: var(--display); font-weight: 800; font-size: 1.45em; color: var(--wire); text-transform: uppercase; letter-spacing: .04em; }
  .joinline { margin-left: auto; display: flex; align-items: center; gap: .7em; color: var(--wire); }
  .joinline b { color: var(--cream); font-family: var(--display); font-size: 1.5em; letter-spacing: .1em; }
  .miniqr { width: 3.4em; height: 3.4em; background: #fff; border-radius: 6px; padding: 2px; }
  .miniqr svg { width: 100%; height: 100%; display: block; }
  .hmain { min-height: 0; padding: 1.4em 1.6em; position: relative; }
  .hfoot {
    display: flex; align-items: center; gap: .6em; flex-wrap: wrap;
    padding: .6em 1.6em; border-top: 1px solid var(--line); background: var(--panel);
  }
  .hfoot .sp { flex: 1; }
  .hfoot .hint { color: var(--wire); font-size: .85em; }
  .hfoot .warn { color: #ffb3ad; font-weight: 700; }

  /* lobby */
  .lobby { height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3.2em; align-items: center; }
  .qrcard { margin: 0; background: #fff; color: var(--ink); border-radius: 18px; padding: 1.1em; display: grid; gap: .5em; justify-items: center; width: min(46vh, 30vw); }
  .qrcard svg { width: 100%; height: auto; display: block; }
  .qrcard .code { font-family: var(--display); font-weight: 900; font-size: 3.2em; letter-spacing: .14em; line-height: 1; }
  .qrcard .url { font-size: .78em; color: #4a4540; text-align: center; word-break: break-all; margin: 0; }
  .who { min-width: 0; min-height: 0; max-height: 100%; overflow-y: auto; display: grid; gap: .9em; align-content: center; }
  .who.wt h1 { font-size: 4em; }
  .who .meta { font-size: 1.35em; }
  .who h1 { font-size: 6em; }
  .who .sub { color: var(--wire); font-size: 1.35em; margin: 0; }
  .who .sub b { color: var(--cream); }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5em; }
  .chip { display: inline-flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; }
  .chip .cn { background: none; border: 0; padding: .4em .15em .4em 1em; font-weight: 800; font-size: 1.2em; display: inline-flex; align-items: center; gap: .45em; }
  .chip .cn i { width: .6em; height: .6em; border-radius: 50%; background: var(--tc, var(--wire)); }
  .chip .cx { background: none; border: 0; color: var(--wire); padding: .4em .85em .4em .45em; font-size: 1em; }
  .chip .cx:hover { color: #ffb3ad; }
  .chip.new { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  .tcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(11em, 1fr)); gap: .8em 1.4em; }
  .tcol h3 { margin: 0 0 .45em; font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 1.5em; display: flex; align-items: center; gap: .4em; color: var(--tx); }
  .tcol h3 small { color: var(--wire); font-size: .7em; }
  .tcol.loose { grid-column: 1 / -1; }
  .tcol .chip .cn { font-size: 1.05em; }
  .drawside #chips { min-height: 0; overflow: hidden; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .offline-note { background: var(--panel); border: 1px solid var(--red); border-radius: 12px; padding: .8em 1em; color: #ffcfc9; }

  /* vraag + antwoord */
  .q { height: 100%; display: grid; gap: 1.2em 1.8em; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .q.no-img { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .frame { overflow: hidden; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); max-width: 100%; max-height: 100%; }
  .frame img { width: 100%; height: 100%; display: block; will-change: transform; }
  .qside { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 1em; }
  .q.no-img .qside { align-items: center; text-align: center; }
  .qside .meta { font-size: 1.35em; }
  .qtext { font-weight: 800; font-size: 2.5em; line-height: 1.12; margin: 0; text-wrap: balance; }
  .q.no-img .qtext { font-size: 3.4em; max-width: 24ch; }
  .timer { display: flex; align-items: center; gap: .8em; width: 100%; max-width: 32em; }
  .timer b { font-family: var(--display); font-size: 4em; font-weight: 900; line-height: 1; min-width: 1.3em; }
  .timer .bar { flex: 1; height: .55em; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .timer .bar i { display: block; height: 100%; width: 100%; background: var(--cream); transform-origin: left center; }
  .answered { color: var(--wire); font-size: 1.25em; }
  .answered b { color: var(--cream); font-size: 1.3em; }
  .numhint { grid-column: 1 / -1; color: var(--wire); font-size: 1.4em; text-align: center; }
  .tiles { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: .75em; }
  .tile {
    display: flex; align-items: center; gap: .7em; min-width: 0;
    padding: .6em 1em; border-radius: 12px; font-weight: 800; font-size: 1.8em; min-height: 2.5em;
    transition: opacity .35s, transform .35s, box-shadow .35s;
  }
  .tile .shape { width: 1.3em; text-align: center; flex: none; font-size: .9em; }
  .tile .otext { min-width: 0; overflow-wrap: anywhere; }
  .tile .count { margin-left: auto; font-family: var(--display); font-size: 1.15em; padding-left: .5em; }
  .tiles.revealed .tile:not(.right) { opacity: .25; }
  .tiles.revealed .tile.right { transform: scale(1.015); box-shadow: 0 0 0 .14em var(--bg), 0 0 0 .32em var(--cream); }
  /* staande foto: volle hoogte links, vraag en antwoorden rechts */
  .q.portrait { grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); }
  .q.portrait .stage { grid-row: 1 / 3; }
  .q.portrait .tiles, .q.portrait .numhint { grid-column: 2; }
  .q.portrait .tile { font-size: 1.45em; }
  .q.portrait .qtext { font-size: 2.3em; }
  .verdict { font-size: 1.35em; color: var(--wire); margin: 0; }
  .verdict b { color: var(--cream); }
  .target { font-family: var(--display); font-weight: 900; font-size: 8em; line-height: .9; }
  .target small { font-size: .35em; color: var(--wire); margin-left: .2em; }
  .closest { list-style: none; margin: 0; padding: 0; display: grid; gap: .35em; font-size: 1.3em; width: 100%; max-width: 30em; }
  .closest li { text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: .9em; align-items: baseline; padding: .3em 0; border-bottom: 1px solid var(--line); }
  .closest li:first-child b { color: var(--brass); }
  .closest b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .closest small { color: var(--wire); }
  .closest em { font-style: normal; color: var(--green); font-weight: 800; }

  /* rondetitel */
  .titlecard { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: .5em; }
  .titlecard .meta { font-size: 1.6em; }
  .titlecard h1 { font-size: 9em; max-width: 12ch; }
  .titlecard p { font-size: 2em; color: var(--wire); max-width: 32ch; margin: .2em 0 0; }

  /* loting: het rad */
  .draw { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 2.6em; align-items: center; }
  .wheelbox { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .wheel { position: relative; width: min(100%, 62vh); aspect-ratio: 1; }
  .wheel svg { width: 100%; height: 100%; display: block; }
  .wheel .pointer { position: absolute; top: -.4em; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 1em solid transparent; border-right: 1em solid transparent; border-top: 1.9em solid var(--cream); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .6)); z-index: 2; }
  .drawside { display: grid; gap: 1em; align-content: center; min-width: 0; }
  .drawside .meta { font-size: 1.35em; }
  .drawname { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 6.4em; line-height: .9; margin: 0; overflow-wrap: anywhere; }
  .drawto { font-size: 2em; margin: 0; color: var(--wire); min-height: 1.3em; }
  .drawto b { color: var(--tx); font-family: var(--display); text-transform: uppercase; font-size: 1.4em; letter-spacing: .03em; }

  /* stand */
  .board { height: 100%; display: flex; flex-direction: column; gap: 1em; }
  .board h1 { font-size: 3.8em; }
  .rank { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; display: grid; gap: .3em 2.4em; grid-auto-flow: column; }
  .rank li { display: grid; grid-template-columns: 2em minmax(0, 9em) minmax(0, 1fr) 4.2em 4.6em; gap: .9em; align-items: center; font-size: 1.4em; min-height: 0; }
  .rank .pos { font-family: var(--display); font-weight: 900; font-size: 1.4em; color: var(--wire); text-align: right; }
  .rank li.first .pos { color: var(--brass); }
  .rank .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .bar { height: .7em; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .rank .bar i { display: block; height: 100%; width: calc(var(--w, 0) * 100%); background: var(--cream); border-radius: 99px; transition: width 1.2s cubic-bezier(.2, .7, .2, 1); }
  .rank li.first .bar i { background: var(--brass); }
  .rank .dl { color: var(--green); font-weight: 800; text-align: right; }
  .rank .sc { font-family: var(--display); font-weight: 900; font-size: 1.35em; text-align: right; }
  .rank .nm i { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--tc); margin-right: .45em; vertical-align: middle; }
  .tstrip { display: grid; gap: .8em; }
  .tcard { background: var(--tc); color: var(--tf); border-radius: 12px; padding: .45em 1em; display: flex; align-items: baseline; gap: .7em; font-size: 1.25em; min-width: 0; }
  .tcard .tp { font-family: var(--display); font-weight: 900; font-size: 1.6em; }
  .tcard b { font-family: var(--display); font-weight: 900; font-size: 1.5em; text-transform: uppercase; letter-spacing: .03em; }
  .tcard span { margin-left: auto; font-weight: 700; white-space: nowrap; }

  /* opdracht: de quizmaster tikt aan wie de punten verdient */
  .q.task { grid-template-rows: minmax(0, 1fr); }
  .qside .help { color: var(--wire); font-size: 1.2em; margin: 0; }
  .pick { display: flex; flex-wrap: wrap; gap: .5em; }
  .q.no-img .pick { justify-content: center; }
  .pk { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: .45em 1.05em; font-weight: 800; font-size: 1.2em; }
  .pk:hover { border-color: var(--wire); }
  .pk.on { background: var(--green); border-color: var(--green); color: #fff; }
  .pk.on::before { content: '✓ '; }
  .pk.tm { background: var(--tc); color: var(--tf); border-color: var(--tc); }
  .pk.tm.on { box-shadow: 0 0 0 .16em var(--bg), 0 0 0 .32em var(--green); }
  .tclock { display: flex; align-items: center; gap: .8em; width: 100%; max-width: 32em; }
  .field { display: grid; gap: .35em; min-width: 0; }
  .field > label, .lbl { font-size: .78em; text-transform: uppercase; letter-spacing: .08em; color: var(--wire); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: .8em; align-items: center; }

  /* eindstand */
  .end { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 1em; }
  .teamwin { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: .3em 1.2em; font-size: 1.35em; color: var(--wire); }
  .teamwin b { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 2.2em; color: var(--tx); letter-spacing: .03em; }
  .end.wt .pod.p1 .blk { height: 34vh; }
  .end.wt .pod.p2 .blk { height: 23vh; }
  .end.wt .pod.p3 .blk { height: 15vh; }
  .end h1 { font-size: 3.8em; }
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 1.2em; min-height: 0; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: .3em; min-width: 0; }
  .pod .nm { font-size: 2.4em; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .sc { color: var(--wire); font-size: 1.2em; }
  .pod .blk { width: 100%; border-radius: 14px 14px 0 0; display: flex; justify-content: center; padding-top: .3em; font-family: var(--display); font-weight: 900; font-size: 4.4em; color: var(--ink); }
  .pod.p1 .blk { height: 44vh; background: var(--brass); }
  .pod.p2 .blk { height: 30vh; background: var(--cream); }
  .pod.p3 .blk { height: 20vh; background: var(--bronze); }
  .rest { color: var(--wire); font-size: 1.2em; margin: 0; text-align: center; }

  /* ── EDITOR ── */
  .editor { min-height: 100vh; display: flex; flex-direction: column; }
  .ebar {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: .6em; align-items: center;
    padding-block: .8em;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .ebar .brand { font-size: 1.45em; margin-right: .4em; }
  .ebar #qtitle { flex: 1 1 14em; width: auto; font-weight: 700; }
  .ebody {
    display: grid; grid-template-columns: minmax(16em, 25em) minmax(0, 1fr); gap: 1.2em; align-items: start;
    padding-block: 1.2em;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .elist-wrap { display: grid; gap: .6em; position: sticky; top: 5em; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: .9em; text-align: center; color: var(--wire); font-size: .92em; }
  .drop.over, .eform.over { border-color: var(--brass); color: var(--cream); }
  .elist { list-style: none; margin: 0; padding: 0; display: grid; gap: .35em; max-height: calc(100vh - 12em); overflow: auto; }
  .elist li {
    display: grid; grid-template-columns: 1.6em 3.2em minmax(0, 1fr) auto; gap: .55em; align-items: center;
    padding: .4em .5em; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer;
  }
  .elist li.on { border-color: var(--cream); }
  .elist .n { color: var(--wire); font-variant-numeric: tabular-nums; text-align: right; }
  .elist .th { width: 3.2em; height: 2.4em; border-radius: 6px; background: var(--panel-2) center / cover no-repeat; }
  .elist .t { min-width: 0; }
  .elist .t small { display: block; color: var(--brass); font-size: .72em; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
  .elist .t small.bad { color: #ff8f86; }
  .elist .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .elist .ops { display: flex; }
  .elist .ops button { background: none; border: 0; color: var(--wire); padding: .2em .35em; font-size: 1em; }
  .elist .ops button:hover { color: var(--cream); }
  .eform { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 1.2em; display: grid; gap: 1em; min-width: 0; }
  .eform .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(11em, 1fr)); gap: 1em; }
  .check { display: flex; gap: .5em; align-items: center; font-weight: 600; }
  .check input { width: 1.15em; height: 1.15em; accent-color: var(--brass); }
  .opts { display: grid; gap: .5em; }
  .opt { display: grid; grid-template-columns: auto 2.2em minmax(0, 1fr); gap: .6em; align-items: center; }
  .opt input[type=radio] { width: 1.2em; height: 1.2em; accent-color: var(--green); }
  .opt .sw { height: 2.2em; border-radius: 8px; display: grid; place-items: center; font-size: .9em; }
  .pe { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1em; align-items: start; }
  .pe-img { position: relative; border-radius: 10px; overflow: hidden; background: var(--bg); }
  .pe-img.zoomable { cursor: crosshair; }
  .pe-img img { display: block; width: 100%; }
  .cross { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 3px solid var(--brass); border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); pointer-events: none; }
  .pe-start { display: grid; gap: .4em; }
  .pe-start .box { overflow: hidden; border-radius: 10px; }
  .pe-start .box img { display: block; width: 100%; }
  .pe-start small, .hintline { color: var(--wire); }
  .empty-note { color: var(--wire); }

  /* ── SPELER / GSM ── */
  .phone {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 36em; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .pbar { display: flex; align-items: center; gap: .7em; padding: .8em 0; border-bottom: 1px solid var(--line); }
  .pbar .brand { font-size: 1.2em; }
  .pbar .me { margin-left: auto; text-align: right; font-weight: 800; line-height: 1.15; min-width: 0; }
  .pbar .me small { display: block; color: var(--wire); font-weight: 500; }
  .pmain { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1em; padding: 1.2em 0 1.6em; }
  .pbig.plain { text-transform: none; }
  .pbig { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 3.4em; line-height: .95; margin: 0; text-wrap: balance; }
  .psub { color: var(--wire); margin: 0; font-size: 1.08em; }
  .psub b { color: var(--cream); }
  .pmeta { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); margin: 0; }
  .pq { font-weight: 800; font-size: 1.25em; margin: 0; line-height: 1.25; }
  .ptimer { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .ptimer i { display: block; height: 100%; width: 100%; background: var(--cream); transition: width .25s linear; }
  .pbtns { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
  .pbtns button {
    border: 0; border-radius: 16px; min-height: 8.5em; padding: .9em;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: .5em;
    font-weight: 800; font-size: 1.1em; text-align: left; overflow-wrap: anywhere;
  }
  .pbtns button:active { transform: scale(.97); }
  .pbtns .shape { font-size: 2em; line-height: 1; }
  .pbtns.closed button { opacity: .35; }
  .pform { display: grid; gap: .7em; }
  .pform input { font-family: var(--display); font-size: 2.6em; font-weight: 900; text-align: center; padding: .25em; }
  .psent { border-radius: 18px; padding: 1.3em; display: grid; gap: .5em; background: var(--panel-2); }
  .psent .shape { font-size: 2.6em; line-height: 1; }
  .psent b { font-size: 1.5em; }
  .psent small { opacity: .8; }
  .pres { border-radius: 18px; padding: 1.4em; display: grid; gap: .3em; }
  .pres.ok { background: var(--green); color: #fff; }
  .pres.no { background: var(--red); color: #fff; }
  .pres.neutral { background: var(--panel-2); }
  .pres .ptitle { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 2.2em; line-height: 1; }
  .pres .pts { font-family: var(--display); font-weight: 900; font-size: 4.4em; line-height: 1; }
  .pjoin { display: grid; gap: .8em; }
  .pteam { border-radius: 18px; padding: 1.4em; background: var(--tc); color: var(--tf); display: grid; gap: .25em; }
  .pteam b { font-family: var(--display); font-size: 3.6em; font-weight: 900; text-transform: uppercase; line-height: 1; }
  .ttag { display: inline-block; padding: .05em .55em; border-radius: 99px; background: var(--tc); color: var(--tf); font-size: .75em; font-weight: 800; margin-left: .35em; vertical-align: middle; }
  .pjoin input { font-size: 1.5em; text-align: center; font-weight: 700; padding: .5em; }
  .linkbtn { background: none; border: 0; color: var(--wire); text-decoration: underline; padding: .4em 0; justify-self: start; }

  /* ── KLEINE SCHERMEN (quizmaster op gsm) ── */
  @media (max-width: 760px) {
    .host { height: auto; min-height: 100dvh; overflow: visible; font-size: 13px; }
    .hbar, .hmain, .hfoot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .hbar { flex-wrap: wrap; }
    .hfoot .hint { display: none; }
    .lobby, .draw { grid-template-columns: minmax(0, 1fr); gap: 1.4em; }
    .wheel { width: min(80vw, 22em); }
    .drawname { font-size: 3.4em; }
    .qrcard { width: min(70vw, 18em); justify-self: center; }
    .who h1 { font-size: 3.6em; }
    .q, .q.no-img, .q.portrait { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    .q.portrait .stage { grid-row: auto; }
    .q.portrait .tiles, .q.portrait .numhint { grid-column: 1 / -1; }
    .stage { height: 45vh; }
    .tiles { grid-template-columns: 1fr; }
    .tile { font-size: 1.4em; }
    .titlecard h1 { font-size: 5em; }
    .rank { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
    .rank li { grid-template-columns: 1.6em minmax(0, 1fr) 3.4em 4em; }
    .rank .bar { display: none; }
    .ebody, .pe { grid-template-columns: minmax(0, 1fr); }
    .elist-wrap { position: static; }
    .pod .blk { font-size: 2.6em; }
    .pod .nm { font-size: 1.5em; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="mqtt.min.js"></script>
<script src="qrcode.js"></script>
<script>
(() => {
  'use strict';

  // ── HULPJES ──
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const app = $('#app');
  const params = new URLSearchParams(location.search);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, Number.isFinite(v) ? v : a));
  const fmt = n => Number.isFinite(Number(n)) ? Number(n).toLocaleString('nl-BE') : '–';
  const str = (v, max) => typeof v === 'string' ? v.slice(0, max) : '';
  const cleanName = s => String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 18);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* privémodus: dan maar zonder */ } },
  };
  const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const ID_ABC = 'abcdefghijkmnpqrstuvwxyz23456789';
  const rnd = (n, abc = CODE_ABC) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => abc[b % abc.length]).join('');
  const newId = () => 'q' + rnd(7, ID_ABC);

  function toast(msg) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── VERBINDING (publieke MQTT-server, geen accounts nodig) ──
  const BROKERS = [
    { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'Mosquitto', url: 'wss://test.mosquitto.org:8081/mqtt' },
  ];
  const customBroker = params.get('broker');
  const brokerUrl = b => customBroker || (BROKERS[b] || BROKERS[0]).url;
  const topic = room => 'fotofinish/v1/' + room;

  function openLink({ url, subs, onMsg, onState, onUp }) {
    if (!window.mqtt) { onState('nolib'); return null; }
    const c = mqtt.connect(url, {
      clientId: 'ff_' + rnd(10, ID_ABC), keepalive: 20, reconnectPeriod: 2000,
      connectTimeout: 10000, clean: true, protocolVersion: 4,
    });
    c.on('connect', () => { onState('on'); c.subscribe(subs, { qos: 1 }); if (onUp) onUp(); });
    c.on('reconnect', () => onState('wait'));
    c.on('offline', () => onState('off'));
    c.on('error', e => console.warn('verbinding', e && e.message));
    c.on('message', (t, buf) => {
      let m;
      try { m = JSON.parse(buf.toString()); } catch { return; }
      onMsg(t, m);
    });
    return c;
  }

  // ── QUIZ-INHOUD ──
  const SHAPES = ['●', '▲', '■', '◆'];
  const TYPES = { mc: 'Meerkeuze', num: 'Schatting', task: 'Opdracht', title: 'Rondetitel' };
  const DEF_TIME = { mc: 20, num: 30, task: 0, title: 0 };
  const CLOSEST = [1000, 750, 550, 400, 300, 200, 150, 100];
  // c = teamkleur, fg = tekst op die kleur, tx = teamkleur als tekst op de donkere achtergrond
  const TEAMS = [
    { id: 't1', n: 'Team 1', c: '#b8323a', fg: '#ffffff', tx: '#ef7a80' },
    { id: 't2', n: 'Team 2', c: '#2f6db5', fg: '#ffffff', tx: '#7fb0ec' },
    { id: 't3', n: 'Team 3', c: '#2e8b57', fg: '#ffffff', tx: '#6fcf98' },
    { id: 't4', n: 'Team 4', c: '#d4ab45', fg: '#141210', tx: '#e2bd5c' },
  ];
  const teamById = id => TEAMS.find(t => t.id === id) || null;
  const teamVars = t => t ? `--tc:${t.c};--tf:${t.fg};--tx:${t.tx}` : '';

  function normItem(r) {
    if (!r || typeof r !== 'object') return null;
    const type = TYPES[r.type] ? r.type : 'mc';
    const it = {
      id: typeof r.id === 'string' && /^[\w-]{1,24}$/.test(r.id) ? r.id : newId(),
      type,
      title: str(r.title, 80),
      text: str(r.text, 260),
      img: typeof r.img === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(r.img) ? r.img : '',
      hide: !!r.hide,
      dbl: !!r.dbl,
      time: type === 'task' ? clamp(Number(r.time) || 0, 0, 600) : clamp(Number(r.time) || DEF_TIME[type] || 20, 5, 180),
      zoom: null,
      options: Array.isArray(r.options) ? r.options.slice(0, 4).map(o => str(o, 90)) : [],
      correct: null,
      unit: str(r.unit, 16),
      pts: clamp(Number(r.pts) || 500, 10, 5000),
    };
    while (it.options.length < 4) it.options.push('');
    if (r.zoom && typeof r.zoom === 'object') it.zoom = { x: clamp(Number(r.zoom.x), 0, 100), y: clamp(Number(r.zoom.y), 0, 100), s: clamp(Number(r.zoom.s) || 6, 1.5, 14) };
    if (type === 'mc') it.correct = clamp(Math.round(Number(r.correct) || 0), 0, 3);
    else if (r.correct !== null && r.correct !== '' && Number.isFinite(Number(r.correct))) it.correct = Number(r.correct);
    return it;
  }
  function uniqueIds(list) {
    const seen = new Set();
    for (const it of list) { while (seen.has(it.id)) it.id = newId(); seen.add(it.id); }
    return list;
  }
  // Lege antwoorden achteraan tellen niet mee
  function playOpts(it) {
    const o = it.options.slice();
    while (o.length && !o[o.length - 1].trim()) o.pop();
    return o;
  }
  function playable(it) {
    if (it.type === 'title') return !!(it.title || it.text);
    if (it.type === 'mc') { const o = playOpts(it); return o.length >= 2 && it.correct < o.length && !!o[it.correct].trim(); }
    if (it.type === 'num') return Number.isFinite(it.correct);
    if (it.type === 'task') return !!it.text.trim();
    return true;
  }

  function testQuiz() {
    return {
      title: 'Testquiz',
      items: uniqueIds([
        { type: 'title', title: 'Testronde', text: 'Even checken of alle gsm\'s meedoen.' },
        { type: 'mc', text: 'Hoe heet deze quiz?', options: ['Fotomodel', 'Fotofinish', 'Fotokopie', 'Fotosynthese'], correct: 1, time: 20 },
        { type: 'num', text: 'Hoeveel liter wijn zit er in een magnum?', correct: 1.5, unit: 'liter', time: 25 },
        { type: 'task', text: 'Wie als eerste een vol glas omhoog houdt, krijgt 500 punten.', pts: 500 },
      ].map(normItem)),
    };
  }

  // Wijnweetjes, deels uit de Flavory Live-proeverij. "+ Wijnronde" in de editor zet er telkens 6 nieuwe in.
  const WINE_BANK = [
    { type: 'mc', text: "Wat betekent 'Saperavi', de naam van de Georgische druif, letterlijk?", options: ['Rood vuur', 'Verf', 'Steenrots', 'Oude wijnstok'], correct: 1 },
    { type: 'mc', text: 'Garnacha is Spaans. Hoe heet dezelfde druif in Frankrijk?', options: ['Grenache', 'Gamay', 'Carignan', 'Cinsault'], correct: 0 },
    { type: 'num', text: "Hoeveel bar druk staat er op een fles champagne? (Een autoband: zo'n 2,5.)", correct: 6, unit: 'bar' },
    { type: 'mc', text: 'Wat is zoeter: brut of extra dry?', options: ['Brut', 'Extra dry', 'Ze zijn even zoet', 'Hangt af van het jaar'], correct: 1 },
    { type: 'mc', text: 'Ook de Westhoek maakt wijn. Welke streek heeft een eigen beschermde benaming?', options: ['De Moeren', 'Heuvelland', 'Houtland', 'De IJzervallei'], correct: 1 },
    { type: 'mc', text: 'In 1985 kwam Oostenrijk in een wijnschandaal terecht. Wat zat er in sommige zoete wijnen?', options: ['Antivries', 'Suikerbietensiroop', 'Wodka', 'Afwasmiddel'], correct: 0 },
    { type: 'mc', text: "Wat verraden de 'tranen' die langs de binnenkant van je glas lopen?", options: ['De kwaliteit', 'Het alcoholgehalte', 'De leeftijd', 'De zuurtegraad'], correct: 1 },
    { type: 'mc', text: 'Hoeveel liter zit er in een Nebukadnezar?', options: ['6 liter', '9 liter', '15 liter', '30 liter'], correct: 2 },
    { type: 'num', text: 'Hoeveel jaar maken ze in Georgië al wijn?', correct: 8000, unit: 'jaar' },
    { type: 'mc', text: "Waar komt het woord 'proost' vandaan?", options: ["Latijn: 'moge het baten'", "Frans: 'pour toast'", "Duits: 'vrolijk'", "Oudnederlands: 'proeven'"], correct: 0 },
    { type: 'mc', text: 'Brunello di Montalcino is een Toscaanse topwijn. Van welke druif?', options: ['Nebbiolo', 'Sangiovese', 'Merlot', 'Montepulciano'], correct: 1 },
    { type: 'mc', text: 'Welke kleur heeft het sap van de meeste blauwe druiven?', options: ['Donkerrood', 'Paars', 'Kleurloos', 'Roze'], correct: 2 },
    { type: 'mc', text: 'Dom Pérignon, de naam achter de beroemde champagne, was…', options: ['Een monnik', 'Een koning', 'Een generaal', 'Een kok'], correct: 0 },
    { type: 'num', text: 'De oudste ongeopende fles wijn ter wereld ligt in Speyer (Duitsland). Hoeveel jaar oud is die ongeveer?', correct: 1700, unit: 'jaar' },
    { type: 'mc', text: 'Hoe heet de angst voor wijn?', options: ['Druivofobie', 'Oenofobie', 'Bacchofobie', 'Sommeliersfobie'], correct: 1 },
    { type: 'mc', text: 'Welk land drinkt per inwoner de meeste wijn?', options: ['Frankrijk', 'Portugal', 'Vaticaanstad', 'Italië'], correct: 2 },
    { type: 'mc', text: 'Moldavië was ooit de wijnfabriek van een groot rijk. Van welk?', options: ['Het Ottomaanse Rijk', 'De Sovjet-Unie', 'Oostenrijk-Hongarije', 'Het Romeinse Rijk'], correct: 1 },
    { type: 'mc', text: 'Welke molecule geeft Grüner Veltliner zijn witte-pepertoets?', options: ['Rotundone', 'Capsaïcine', 'Piperine', 'Eugenol'], correct: 0 },
    { type: 'mc', text: 'Cava maakt men volgens de Método Tradicional. Wat betekent dat?', options: ['Koolzuur achteraf toevoegen', 'Tweede gisting in de fles', 'Druiven met de voeten persen', 'Rijpen in een grot'], correct: 1 },
    { type: 'mc', text: 'Wat is bijzonder aan de Saperavi-druif?', options: ['Ze groeit alleen boven 2000 meter', 'Ook het vruchtvlees is rood', 'Ze heeft geen pitten', 'Ze rijpt pas na de eerste vorst'], correct: 1 },
    { type: 'mc', text: 'Topchef Jan Hendrik van der Westhuizen, de eerste Zuid-Afrikaan met een Michelinster, heeft zijn restaurant JAN in…', options: ['Kaapstad', 'Stellenbosch', 'Nice', 'Londen'], correct: 2 },
    { type: 'mc', text: 'Welke druif hoort NIET in champagne?', options: ['Chardonnay', 'Pinot Noir', 'Pinot Meunier', 'Sauvignon Blanc'], correct: 3 },
    { type: 'mc', text: 'Hoe wordt rosé meestal gemaakt?', options: ['Rode en witte wijn mengen', 'Blauwe druiven kort op de schil laten weken', 'Witte wijn met bessensap', 'Rode wijn aanlengen met water'], correct: 1 },
    { type: 'mc', text: 'Welk land heeft de meeste hectare wijngaard ter wereld?', options: ['Frankrijk', 'Italië', 'Spanje', 'Verenigde Staten'], correct: 2 },
    { type: 'mc', text: "Wat veroorzaakt een 'kurksmaak'?", options: ['Te veel zuurstof', 'De stof TCA', 'Te warm bewaard', 'Een stukje kurk in de wijn'], correct: 1 },
    { type: 'mc', text: 'Waarom bewaar je een fles met kurk liggend?', options: ['Zo past er meer in het rek', 'Zodat de kurk niet uitdroogt', 'Zodat het depot niet bezinkt', 'Om de wijn te laten ademen'], correct: 1 },
    { type: 'num', text: 'Hoeveel jaar duurt het ongeveer voor een nieuw geplante wijnstok druiven geeft die goed genoeg zijn voor wijn?', correct: 3, unit: 'jaar' },
    { type: 'mc', text: "Wat is een 'Blanc de Noirs'?", options: ['Witte wijn van blauwe druiven', 'Rode wijn van witte druiven', 'Wijn met een zwarte kurk', "Wijn van druiven die 's nachts geplukt zijn"], correct: 0 },
  ];

  // ── OPSLAG OP DE LAPTOP (foto's zijn te groot voor localStorage) ──
  const idb = {
    db: null,
    open() {
      return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => {
        const r = indexedDB.open('fotofinish', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(this.db = r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(k) {
      const db = await this.open();
      return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    },
    async set(k, v) {
      const db = await this.open();
      return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
    },
  };

  function qrSvg(text) {
    if (!window.qrcode) return `<p>${esc(text)}</p>`;
    const q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  }

  // ════════════════════════════════════════════════════════════
  //  QUIZMASTER (laptop aan de beamer)
  // ════════════════════════════════════════════════════════════
  const H = { quiz: null, g: null, c: null, link: 'off', key: '', mode: 'game', ei: 0, pubT: 0, lastPub: 0, saveT: 0, seen: new Set() };
  const items = () => H.quiz.items;
  const cur = () => items()[H.g.idx];
  const pname = pid => (H.g.players[pid] || {}).n || '?';
  const isQuestion = it => it && ['mc', 'num'].includes(it.type);
  const qNumber = idx => items().slice(0, idx + 1).filter(isQuestion).length;
  const qCount = () => items().filter(isQuestion).length;

  function newGame(room) {
    return { room: room || rnd(5), b: 0, phase: 'lobby', idx: -1, players: {}, gone: {}, answers: {}, results: {}, targets: {}, tEnd: null, qStart: 0, qEnd: 0, seq: 0, nTeams: 0, teams: {}, draw: null };
  }
  function joinUrl() {
    const g = H.g;
    let u = location.origin + location.pathname + '?r=' + g.room;
    if (g.b) u += '&b=' + g.b;
    if (customBroker) u += '&broker=' + encodeURIComponent(customBroker);
    return u;
  }

  function ranking() {
    const g = H.g, tot = {};
    for (const pid of Object.keys(g.players)) tot[pid] = 0;
    for (const res of Object.values(g.results)) for (const [pid, r] of Object.entries(res)) if (pid in tot) tot[pid] += r.pts || 0;
    const list = Object.keys(tot).map(pid => ({ pid, n: g.players[pid].n, s: tot[pid], t: g.nTeams ? g.teams[pid] || null : null }))
      .sort((a, b) => b.s - a.s || a.n.localeCompare(b.n));
    list.forEach((p, i) => { p.rank = i && p.s === list[i - 1].s ? list[i - 1].rank : i + 1; });
    return list;
  }
  const activeTeams = () => TEAMS.slice(0, H.g.nTeams);
  // Teamscore = gemiddelde per speler, zodat een team van 3 niet verliest van een team van 4
  function teamRanking() {
    const list = ranking();
    const tr = activeTeams().map(t => {
      const m = list.filter(p => p.t === t.id), sum = m.reduce((a, p) => a + p.s, 0);
      return { ...t, size: m.length, avg: m.length ? Math.round(sum / m.length) : 0 };
    }).sort((a, b) => b.avg - a.avg);
    tr.forEach((t, i) => { t.rank = i && t.avg === tr[i - 1].avg ? tr[i - 1].rank : i + 1; });
    return tr;
  }
  function smallestTeams() {
    const counts = activeTeams().map(t => ({ id: t.id, k: Object.keys(H.g.players).filter(pid => H.g.teams[pid] === t.id).length }));
    const min = Math.min(...counts.map(c => c.k));
    return counts.filter(c => c.k === min).map(c => c.id);
  }
  const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  async function hostBoot() {
    try { const q = await idb.get('quiz'); if (q && Array.isArray(q.items)) H.quiz = { title: q.title || 'Fotofinish', items: uniqueIds(q.items.map(normItem).filter(Boolean)) }; } catch { /* geen opslag: testquiz */ }
    if (!H.quiz || !H.quiz.items.length) H.quiz = testQuiz();
    const saved = store.get('ff_game', null);
    H.g = saved && saved.room ? Object.assign(newGame(saved.room), saved) : newGame();
    for (const pid of Object.keys(H.g.players)) H.seen.add(pid);
    if (H.g.idx >= items().length) { H.g.idx = -1; H.g.phase = 'lobby'; }
    if (H.g.draw && H.g.draw.spinning) finishSpin(true);
    if (H.g.phase === 'draw' && !H.g.draw) H.g.phase = 'lobby';
    if (!cur() && !['lobby', 'end', 'draw'].includes(H.g.phase)) H.g.phase = 'lobby';
    connectHost();
    app.addEventListener('click', onHostClick);
    app.addEventListener('input', onHostInput);
    app.addEventListener('change', onHostChange);
    app.addEventListener('dragover', onDrag);
    app.addEventListener('dragleave', onDrag);
    app.addEventListener('drop', onDrop);
    document.addEventListener('keydown', onHostKey);
    window.addEventListener('resize', fitPhoto);
    document.addEventListener('fullscreenchange', () => setTimeout(fitPhoto, 60));
    setInterval(hostTick, 200);
    render(true);
  }

  function connectHost() {
    const g = H.g;
    H.c = openLink({
      url: brokerUrl(g.b),
      subs: [topic(g.room) + '/up/+'],
      onMsg: hostMsg,
      onState: s => { H.link = s; const d = $('#link'); if (d) d.className = 'dot ' + s; if (s === 'on') publish(); patchWarn(); },
    });
  }
  function reconnect() {
    if (H.c) H.c.end(true);
    H.link = 'wait';
    connectHost();
  }
  function commit(rerender = true) {
    store.set('ff_game', H.g);
    publish();
    if (rerender) render();
  }
  function publish() {
    clearTimeout(H.pubT);
    H.pubT = setTimeout(() => {
      if (!H.c || !H.c.connected) return;
      H.lastPub = Date.now();
      H.c.publish(topic(H.g.room) + '/state', JSON.stringify(publicState()), { qos: 1, retain: true });
    }, 60);
  }

  // Wat de gsm's te zien krijgen. Het juiste antwoord gaat pas mee na de onthulling.
  function publicState() {
    const g = H.g, it = cur();
    const s = { v: ++g.seq, ph: g.phase, i: g.idx, n: items().length };
    if (it && g.phase !== 'lobby' && g.phase !== 'end') {
      s.q = { id: it.id, t: it.type, tx: it.text, ti: it.title, dbl: it.dbl };
      if (it.type === 'mc') s.q.o = playOpts(it);
      if (it.unit) s.q.u = it.unit;
    }
    if (g.phase === 'question') { s.left = Math.max(0, g.qEnd - Date.now()); s.dur = it.time * 1000; }
    if (g.phase === 'reveal') s.ok = it.type === 'mc' ? it.correct : g.targets[it.id];
    const ans = it ? g.answers[it.id] || {} : {};
    const res = it ? g.results[it.id] : null;
    s.cnt = Object.keys(ans).length;
    s.pl = {};
    for (const p of ranking()) {
      const r = res && res[p.pid];
      s.pl[p.pid] = { n: p.n, s: p.s, r: p.rank, a: ans[p.pid] ? 1 : 0, d: r ? r.pts : null, k: r && r.ok != null ? (r.ok ? 1 : 0) : null, t: p.t };
    }
    if (g.nTeams) s.tm = teamRanking().map(t => ({ id: t.id, avg: t.avg, r: t.rank, k: t.size }));
    return s;
  }

  function hostMsg(t, m) {
    const pid = t.split('/').pop(), g = H.g;
    if (!/^[a-z0-9]{6,20}$/.test(pid) || !m || typeof m !== 'object') return;
    if (m.t === 'join') {
      const n = cleanName(m.n);
      if (!n || g.gone[pid]) return;
      const p = g.players[pid];
      if (p && p.n === n) return publish();
      g.players[pid] = { n, j: p ? p.j : Date.now() };
      if (g.nTeams && !g.teams[pid]) {
        if (g.phase === 'draw' && g.draw) g.draw.order.push(pid);
        else g.teams[pid] = pickOne(smallestTeams());
      }
      commit(false);
      patchLive();
    } else if (m.t === 'ans') {
      const it = cur();
      if (g.phase !== 'question' || !it || m.q !== it.id || !g.players[pid]) return;
      const a = g.answers[it.id] || (g.answers[it.id] = {});
      if (a[pid]) return publish();
      const v = Number(m.v);
      if (!Number.isFinite(v)) return;
      if (it.type === 'mc' && (!Number.isInteger(v) || v < 0 || v >= playOpts(it).length)) return;
      a[pid] = { v, ms: Date.now() - g.qStart };
      commit(false);
      patchLive();
    }
  }

  function startItem(i) {
    const g = H.g;
    while (i < items().length && !playable(items()[i])) i++;
    if (i >= items().length) { g.phase = 'end'; return commit(); }
    const it = items()[i];
    g.idx = i;
    if (it.type === 'title') g.phase = 'title';
    else if (it.type === 'task') { g.phase = 'task'; g.results[it.id] = g.results[it.id] || {}; g.tEnd = null; }
    else {
      g.phase = 'question';
      g.answers[it.id] = {};
      delete g.results[it.id];
      g.qStart = Date.now();
      g.qEnd = g.qStart + it.time * 1000;
    }
    commit();
  }
  function advance() { startItem(H.g.idx + 1); }
  function lockQuestion() {
    if (H.g.phase === 'question') reveal();
  }

  function reveal() {
    const g = H.g, it = cur(), ans = g.answers[it.id] || {}, res = {}, mult = it.dbl ? 2 : 1;
    if (it.type === 'mc') {
      const dur = it.time * 1000;
      for (const [pid, a] of Object.entries(ans)) {
        const ok = a.v === it.correct;
        res[pid] = { ok, v: a.v, ms: a.ms, pts: ok ? Math.round(500 + 500 * Math.max(0, 1 - a.ms / dur)) * mult : 0 };
      }
    } else {
      const target = Number(it.correct);
      g.targets[it.id] = target;
      const list = Object.entries(ans).map(([pid, a]) => ({ pid, v: a.v, ms: a.ms, d: Math.abs(a.v - target) }))
        .sort((x, y) => x.d - y.d || x.ms - y.ms);
      let rank = 0;
      list.forEach((e, i) => {
        if (i && e.d !== list[i - 1].d) rank = i;
        res[e.pid] = { ok: rank === 0, v: e.v, ms: e.ms, d: e.d, pts: (CLOSEST[rank] ?? 50) * mult };
      });
    }
    g.results[it.id] = res;
    g.phase = 'reveal';
    commit();
  }

  function next() {
    const g = H.g, it = cur();
    switch (g.phase) {
      case 'lobby':
        if (!items().some(playable)) return toast('Er staat nog geen speelbare vraag in de quiz.');
        if (g.idx < 0) return startItem(0);
        if (it && it.type === 'task') { g.phase = 'task'; return commit(); }
        if (it && it.type !== 'title' && g.results[it.id]) { g.phase = 'board'; return commit(); }
        return startItem(g.idx);
      case 'draw': return spinNext();
      case 'title': return advance();
      case 'question': return lockQuestion();
      case 'reveal':
      case 'task': g.phase = 'board'; return commit();
      case 'board': return advance();
      default: return undefined;
    }
  }

  function hostTick() {
    const g = H.g;
    if (H.mode !== 'game') return;
    if (g.phase === 'task' && g.tEnd) {
      const s = $('#tsecs'), left = g.tEnd - Date.now();
      if (s) s.textContent = left > 0 ? Math.ceil(left / 1000) : 'Tijd!';
      return;
    }
    if (g.phase !== 'question') return;
    const it = cur(), left = g.qEnd - Date.now();
    const secs = $('#secs');
    if (secs) secs.textContent = Math.max(0, Math.ceil(left / 1000));
    const nP = Object.keys(g.players).length, nA = Object.keys(g.answers[it.id] || {}).length;
    if (left <= 0 || (nP > 0 && nA >= nP)) return lockQuestion();
    if (Date.now() - H.lastPub > 3000) publish();
  }

  // ── TEKENEN ──
  function render(force) {
    if (H.mode === 'editor') { H.key = 'editor'; app.innerHTML = editorHtml(); return; }
    const g = H.g, key = g.phase + ':' + g.idx;
    if (!force && key === H.key && g.phase !== 'draw') return patchLive();
    H.key = key;
    app.innerHTML = `<div class="host">${headerHtml()}<main class="hmain">${mainHtml()}</main>${footHtml()}</div>`;
    afterRender();
  }
  function mainHtml() {
    switch (H.g.phase) {
      case 'lobby': return lobbyHtml();
      case 'title': return titleHtml();
      case 'question': return questionHtml(false);
      case 'reveal': return questionHtml(true);
      case 'task': return taskHtml();
      case 'draw': return drawHtml();
      case 'board': return boardHtml();
      case 'end': return endHtml();
      default: return '';
    }
  }
  function headerHtml() {
    const g = H.g, it = cur();
    let mid = '';
    if (it && g.phase !== 'lobby' && g.phase !== 'end') mid = it.type === 'task' ? 'Opdracht' : isQuestion(it) ? `Vraag ${qNumber(g.idx)} / ${qCount()}` : '';
    const join = g.phase === 'lobby' ? '' : `<span class="miniqr">${qrSvg(joinUrl())}</span><span>code <b>${g.room}</b></span>`;
    return `<header class="hbar"><div class="brand"><span class="mark"></span>Fotofinish</div><div class="count">${mid}</div><div class="joinline">${join}<span class="dot ${H.link}" id="link" title="Verbinding met de gsm's"></span></div></header>`;
  }
  function footHtml() {
    const g = H.g, ph = g.phase;
    let left;
    if (ph === 'lobby') {
      left = `<button class="btn" data-act="edit">Quiz bewerken</button>`
        + `<button class="btn" data-act="broker" title="Verbinden de gsm's niet? Probeer een andere server.">Server: ${esc(customBroker ? 'eigen' : BROKERS[g.b].name)}</button>`
        + `<button class="btn" data-act="teams" title="Klik om het aantal teams te kiezen">Teams: ${g.nTeams || 'geen'}</button>`
        + (g.nTeams ? `<button class="btn" data-act="draw">Draai het rad</button>` : '')
        + `<button class="btn" data-act="reset">Scores wissen</button>`
        + `<button class="btn" data-act="newroom">Nieuwe code</button>`;
    } else {
      left = `<button class="btn" data-act="lobby">Naar lobby</button><button class="btn" data-act="fs">Volledig scherm</button>`;
    }
    const label = {
      lobby: g.idx < 0 ? 'Start de quiz' : 'Verder spelen', title: 'Verder', question: 'Stop de tijd',
      draw: g.draw && g.draw.i < g.draw.order.length ? 'Draai' : 'Klaar: naar de lobby',
      reveal: 'Tussenstand', task: 'Tussenstand', board: items().slice(g.idx + 1).some(playable) ? 'Volgende' : 'Eindstand',
    }[ph];
    return `<footer class="hfoot">${left}<span class="sp"></span><span class="warn" id="warn"></span><span class="hint">spatie = verder · F = volledig scherm</span>${label ? `<button class="btn primary" data-act="next">${label} ▸</button>` : ''}</footer>`;
  }
  function chipHtml(p) {
    const t = teamById(p.t);
    return `<li class="chip ${H.seen.has(p.pid) ? '' : 'new'}" style="${teamVars(t)}"><button class="cn" ${H.g.nTeams ? `data-move="${p.pid}" title="Klik om van team te wisselen"` : 'tabindex="-1"'}>${H.g.nTeams ? '<i></i>' : ''}${esc(p.n)}</button>`
      + `<button class="cx" data-kick="${p.pid}" aria-label="${esc(p.n)} verwijderen" title="Verwijderen">×</button></li>`;
  }
  function chipsHtml() {
    const list = ranking().sort((a, b) => a.n.localeCompare(b.n));
    if (!H.g.nTeams) return `<ul class="chips">${list.map(chipHtml).join('')}</ul>`;
    const cols = activeTeams().map(t => ({ t, m: list.filter(p => p.t === t.id) }));
    const loose = list.filter(p => !p.t);
    return `<div class="tcols">${cols.map(c => `<div class="tcol" style="${teamVars(c.t)}"><h3>${c.t.n} <small class="num">${c.m.length}</small></h3><ul class="chips">${c.m.map(chipHtml).join('')}</ul></div>`).join('')}`
      + (loose.length ? `<div class="tcol loose"><h3 style="--tx:var(--wire)">Nog geen team <small class="num">${loose.length}</small></h3><ul class="chips">${loose.map(chipHtml).join('')}</ul></div>` : '') + `</div>`;
  }
  function lobbyHtml() {
    const g = H.g, url = joinUrl(), n = Object.keys(g.players).length, bad = items().filter(it => !playable(it)).length;
    return `<div class="lobby"><figure class="qrcard">${qrSvg(url)}<figcaption><div class="code">${g.room}</div><p class="url">${esc(url.replace(/^https?:\/\//, ''))}</p></figcaption></figure>`
      + `<section class="who ${g.nTeams ? 'wt' : ''}"><p class="meta">${esc(H.quiz.title)} · ${qCount()} vragen${bad ? ` · ${bad} onvolledig` : ''}</p>`
      + `<h1 class="display">Scan de code<br>en doe mee</h1>`
      + `<p class="sub"><b id="nplayers" class="num">${n}</b> ${n === 1 ? 'speler' : 'spelers'} binnen${g.idx >= 0 ? ' · de quiz is al bezig' : ''}</p>`
      + `<div id="chips">${chipsHtml()}</div>`
      + `<p class="offline-note" id="offnote" hidden></p></section></div>`;
  }
  function titleHtml() {
    const it = cur(), head = it.title || it.text;
    // "Ronde 2 · Wie let op?" wordt bovenschrift "Ronde 2" met grote titel "Wie let op?"
    const cut = head.indexOf(' · '), eyebrow = cut > 0 ? head.slice(0, cut) : H.quiz.title, big = cut > 0 ? head.slice(cut + 3) : head;
    return `<div class="titlecard"><p class="meta">${esc(eyebrow)}</p><h1 class="display">${esc(big)}</h1>${it.title && it.text ? `<p>${esc(it.text)}</p>` : ''}</div>`;
  }
  function questionHtml(revealed) {
    const g = H.g, it = cur(), ans = g.answers[it.id] || {};
    const showImg = !!it.img && (revealed || !it.hide);
    const zooming = !revealed && it.zoom && !it.hide && it.img;
    const meta = TYPES[it.type] + (it.dbl ? ' · dubbele punten' : '') + (zooming ? ' · uitzoomer' : '');
    let side = `<div class="qside"><p class="meta">${meta}</p><h1 class="qtext">${esc(it.text)}</h1>`;
    if (!revealed) {
      side += `<div class="timer"><b id="secs" class="num">${Math.max(0, Math.ceil((g.qEnd - Date.now()) / 1000))}</b><div class="bar"><i id="bar"></i></div></div>`
        + `<div class="answered"><b id="cnt" class="num">${Object.keys(ans).length}</b> / <span id="tot" class="num">${Object.keys(g.players).length}</span> geantwoord</div>`;
    } else side += revealSideHtml(it, ans);
    side += '</div>';
    let bottom = '';
    if (it.type === 'mc') bottom = tilesHtml(it, revealed, ans);
    else if (!revealed) bottom = `<p class="numhint">Typ je schatting op je gsm. Wie het dichtst zit, wint.</p>`;
    return `<div class="q ${showImg ? 'with-img' : 'no-img'}">${showImg ? `<div class="stage" id="stage"><div class="frame" id="frame"><img id="qimg" alt="" src="${esc(it.img)}"></div></div>` : ''}${side}${bottom}</div>`;
  }
  function tilesHtml(it, revealed, ans) {
    const opts = playOpts(it), counts = opts.map((_, i) => Object.values(ans).filter(a => a.v === i).length);
    return `<div class="tiles ${revealed ? 'revealed' : ''}">${opts.map((o, i) => `<div class="tile t${i} ${revealed && i === it.correct ? 'right' : ''}"><span class="shape">${revealed && i === it.correct ? '✓' : SHAPES[i]}</span><span class="otext">${esc(o)}</span>${revealed ? `<span class="count num">${counts[i]}</span>` : ''}</div>`).join('')}</div>`;
  }
  function revealSideHtml(it, ans) {
    const g = H.g, res = g.results[it.id] || {}, total = Object.keys(ans).length;
    if (!total) return `<p class="verdict">Niemand gaf een antwoord.</p>`;
    if (it.type === 'mc') {
      const good = Object.entries(res).filter(([, r]) => r.ok).sort((a, b) => a[1].ms - b[1].ms);
      const fast = good[0] ? ` · snelste: <b>${esc(pname(good[0][0]))}</b> (${(good[0][1].ms / 1000).toFixed(1).replace('.', ',')} s)` : '';
      return `<p class="verdict"><b class="num">${good.length}</b> van ${total} juist${fast}</p>`;
    }
    const tgt = g.targets[it.id], unit = it.unit;
    const list = Object.entries(res).sort((a, b) => a[1].d - b[1].d || a[1].ms - b[1].ms).slice(0, 5);
    return `<div class="target num">${fmt(tgt)}${unit ? `<small>${esc(unit)}</small>` : ''}</div>`
      + `<ol class="closest">${list.map(([pid, r]) => `<li><b>${esc(pname(pid))}</b><span class="num">${fmt(r.v)}</span><small class="num">${r.d === 0 ? 'exact!' : (r.v > tgt ? '+' : '−') + fmt(r.d)}</small><em class="num">+${fmt(r.pts)}</em></li>`).join('')}</ol>`;
  }
  function wheelSegments() {
    const ts = activeTeams(), n = ts.length * (ts.length === 2 ? 4 : 3);
    return Array.from({ length: n }, (_, k) => ts[k % ts.length]);
  }
  function wheelSvg() {
    const segs = wheelSegments(), a = 360 / segs.length;
    const pt = (r, deg) => { const t = (deg - 90) * Math.PI / 180; return [(r * Math.cos(t)).toFixed(2), (r * Math.sin(t)).toFixed(2)]; };
    let s = '<circle r="100" fill="#0b0a09"/>';
    segs.forEach((t, k) => {
      const [x1, y1] = pt(96, k * a), [x2, y2] = pt(96, (k + 1) * a), [tx, ty] = pt(62, (k + .5) * a);
      s += `<path d="M0 0L${x1} ${y1}A96 96 0 0 1 ${x2} ${y2}Z" fill="${t.c}" stroke="#141210" stroke-width=".8"/>`
        + `<text x="${tx}" y="${ty}" transform="rotate(${((k + .5) * a).toFixed(2)} ${tx} ${ty})" text-anchor="middle" dominant-baseline="central" fill="${t.fg}" font-size="${segs.length > 9 ? 9 : 11}" font-weight="900" style="font-family:'Big Shoulders Display',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em">${t.n.toUpperCase()}</text>`;
    });
    s += '<circle r="13" fill="#141210" stroke="#f0e4c8" stroke-width="2"/>';
    return `<svg viewBox="-101 -101 202 202" id="wheelsvg" role="img" aria-label="Rad met de teams">${s}</svg>`;
  }
  function drawHtml() {
    const g = H.g, d = g.draw, curT = d && d.cur && !d.spinning ? teamById(g.teams[d.cur]) : null;
    const left = d ? d.order.length - d.i : 0;
    let name = 'Wie is eerst?', to = `Druk op spatie om te draaien.`;
    if (d && d.cur) {
      name = esc(pname(d.cur));
      to = d.spinning ? 'Het rad draait…' : `gaat naar <b style="${teamVars(curT)}">${curT ? curT.n : '?'}</b>`;
    } else if (!left) { name = 'Iedereen zit'; to = 'De teams staan.'; }
    return `<div class="draw"><div class="wheelbox"><div class="wheel"><i class="pointer"></i>${wheelSvg()}</div></div>`
      + `<div class="drawside"><p class="meta">Loting van de teams · nog ${left} te gaan</p><h1 class="drawname">${name}</h1><p class="drawto">${to}</p>`
      + `<div id="chips">${chipsHtml()}</div></div></div>`;
  }
  // Het rad landt altijd op een van de kleinste teams, zodat de teams even groot blijven
  function spinNext() {
    const g = H.g, d = g.draw;
    if (!d || d.spinning) return;
    while (d.i < d.order.length && !g.players[d.order[d.i]]) d.i++;
    if (d.i >= d.order.length) { g.phase = 'lobby'; g.draw = null; return commit(true); }
    const pid = d.order[d.i], target = pickOne(smallestTeams()), segs = wheelSegments(), a = 360 / segs.length;
    const options = segs.map((t, k) => (t.id === target ? k : -1)).filter(k => k >= 0), k = pickOne(options);
    const land = 360 - (k + .5) * a + (Math.random() - .5) * a * .6;
    const base = d.rot - (((d.rot % 360) + 360) % 360);
    d.prev = d.rot;
    d.rot = base + 360 * 6 + ((land % 360) + 360) % 360;
    d.cur = pid;
    d.target = target;
    d.spinning = true;
    commit();
    clearTimeout(H.spinT);
    H.spinT = setTimeout(() => finishSpin(false), 4300);
  }
  function finishSpin(silent) {
    const g = H.g, d = g.draw;
    if (!d || !d.spinning) return;
    g.teams[d.cur] = d.target;
    d.spinning = false;
    d.prev = d.rot;
    d.i++;
    if (!silent) commit();

    return `<div class="end ${tr.length ? 'wt' : ''}"><h1 class="display">Eindstand</h1>${win}<div class="podium">${pod(b, 'p2', 2)}${pod(a, 'p1', 1)}${pod(c, 'p3', 3)}</div>`
      + (list.length > 3 ? `<p class="rest">${list.slice(3).map(p => `${p.rank}. ${esc(p.n)} <span class="num">${fmt(p.s)}</span>`).join(' · ')}</p>` : '<p class="rest"></p>') + `</div>`;

  function afterRender() {
    const g = H.g, it = cur();
    for (const pid of Object.keys(g.players)) H.seen.add(pid);
    const img = $('#qimg');
    if (img) {
      const go = () => {
        $('.q').classList.toggle('portrait', img.naturalHeight > img.naturalWidth * 1.05);
        fitPhoto();
        if (g.phase === 'question' && it.zoom && !it.hide) startZoom(it);
      };
      if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go, { once: true });
    }
    const wheel = $('#wheelsvg');
    if (wheel && g.draw) {
      const d = g.draw;
      wheel.style.transform = `rotate(${d.spinning ? d.prev : d.rot}deg)`;
      if (d.spinning) requestAnimationFrame(() => requestAnimationFrame(() => {
        wheel.style.transition = 'transform 4.1s cubic-bezier(.12, .7, .1, 1)';
        wheel.style.transform = `rotate(${d.rot}deg)`;
      }));
    }
    if (g.phase === 'question') startBar('#bar', g.qEnd, it.time);
    if (g.phase === 'task') startBar('#tbar', g.tEnd, it.time);
    $$('.rank .bar i').forEach(i => requestAnimationFrame(() => requestAnimationFrame(() => i.style.setProperty('--w', i.dataset.w))));
    patchWarn();
  }
  // Tijdsbalk die vanaf de resterende tijd naar nul loopt
  function startBar(sel, end, secs) {
    const bar = $(sel);
    if (!bar || !end) return;
    const left = Math.max(0, end - Date.now());
    bar.style.transition = 'none';
    bar.style.transform = `scaleX(${left / (secs * 1000)})`;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `transform ${left}ms linear`; bar.style.transform = 'scaleX(0)'; }));
  }
  function fitPhoto() {
    const st = $('#stage'), fr = $('#frame'), img = $('#qimg');
    if (!st || !fr || !img || !img.naturalWidth) return;
    const W = st.clientWidth, Hh = st.clientHeight, r = img.naturalWidth / img.naturalHeight;
    let w = W, h = W / r;
    if (h > Hh) { h = Hh; w = Hh * r; }
    fr.style.width = Math.floor(w) + 'px';
    fr.style.height = Math.floor(h) + 'px';
  }
  // De uitzoomer: start ver ingezoomd op een detail en zoomt traag uit tot het einde van de tijd
  function startZoom(it) {
    const img = $('#qimg'), z = it.zoom;
    const total = it.time * 1000, left = Math.max(0, H.g.qEnd - Date.now());
    img.style.transformOrigin = `${z.x}% ${z.y}%`;
    img.style.transition = 'none';
    img.style.transform = `scale(${1 + (z.s - 1) * (left / total)})`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      img.style.transition = `transform ${left}ms cubic-bezier(.6, 0, .9, .5)`;
      img.style.transform = 'scale(1)';
    }));
  }
  function patchLive() {
    const g = H.g, it = cur(), n = Object.keys(g.players).length;
    const cnt = $('#cnt'), tot = $('#tot'), np = $('#nplayers'), chips = $('#chips');
    if (cnt && it) cnt.textContent = Object.keys(g.answers[it.id] || {}).length;
    if (tot) tot.textContent = n;
    if (np) { np.textContent = n; np.nextSibling.textContent = ` ${n === 1 ? 'speler' : 'spelers'} binnen${g.idx >= 0 ? ' · de quiz is al bezig' : ''}`; }
    if (chips) { chips.innerHTML = chipsHtml(); for (const pid of Object.keys(g.players)) H.seen.add(pid); }
    const side = $('#taskside');
    if (side && g.phase === 'task') { side.innerHTML = taskSideHtml(); startBar('#tbar', g.tEnd, it.time); }

  function patchWarn() {
    const w = $('#warn'), note = $('#offnote');
    const msg = H.link === 'nolib' ? 'Geen internet: de gsm\'s kunnen niet meespelen.'
      : H.link === 'off' ? 'Geen verbinding met de server.' : '';
    if (w) w.textContent = H.link === 'on' || H.link === 'wait' ? '' : msg;
    if (note) {
      note.hidden = H.link === 'on' || H.link === 'wait';
      note.textContent = H.link === 'nolib' ? 'De verbindingsbibliotheek laadt niet. De quiz werkt wel op de beamer: laat iedereen roepen en hou de punten zelf bij.'
        : 'Nog geen verbinding. Werken de gsm\'s niet? Klik onderaan op "Server" om een andere te proberen.';
    }

  // ── KNOPPEN EN TOETSEN ──
  function onHostKey(e) {
    if (H.mode !== 'game' || e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  }
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Volledig scherm lukt hier niet. Probeer F11.'));
  }
  function onHostClick(e) {
    if (H.mode === 'editor') return onEditorClick(e);
    const b = e.target.closest('[data-act],[data-award],[data-awardteam],[data-kick],[data-move]');
    if (!b) return;
    const g = H.g, it = cur();
    if (b.dataset.awardteam && it && g.phase === 'task') {
      const res = g.results[it.id] || (g.results[it.id] = {});
      const m = Object.keys(g.players).filter(pid => g.teams[pid] === b.dataset.awardteam);
      const all = m.length && m.every(pid => res[pid]);
      for (const pid of m) { if (all) delete res[pid]; else res[pid] = { pts: it.pts, ok: true }; }
      return commit();
    }
    if (b.dataset.move && g.nTeams) {
      const ids = activeTeams().map(t => t.id), now = ids.indexOf(g.teams[b.dataset.move]);
      g.teams[b.dataset.move] = ids[(now + 1) % ids.length];
      return commit();
    }
    if (b.dataset.award && it && g.phase === 'task') {
      const res = g.results[it.id] || (g.results[it.id] = {}), pid = b.dataset.award;
      if (res[pid]) delete res[pid]; else res[pid] = { pts: it.pts, ok: true };
      return commit();
    }
    if (b.dataset.kick) {
      const pid = b.dataset.kick;
      if (!confirm(`${pname(pid)} uit de quiz halen?`)) return;
      delete g.players[pid];
      g.gone[pid] = 1;
      return commit();
    }
    switch (b.dataset.act) {
      case 'next': return next();
      case 'lobby': if (g.draw && g.draw.spinning) finishSpin(true); g.phase = 'lobby'; g.draw = null; return commit();
      case 'teams':
        g.nTeams = g.nTeams === 0 ? 2 : g.nTeams >= 4 ? 0 : g.nTeams + 1;
        g.teams = {};
        commit(false);
        return render(true);
      case 'draw':
        if (!Object.keys(g.players).length) return toast('Er is nog niemand binnen om te loten.');
        g.teams = {};
        g.draw = { order: shuffle(Object.keys(g.players)), i: 0, cur: null, target: null, spinning: false, rot: 0, prev: 0 };
        g.phase = 'draw';
        return commit();
      case 'fs': return toggleFs();
      case 'edit': H.mode = 'editor'; H.ei = Math.min(H.ei, Math.max(0, items().length - 1)); return render();
      case 'broker': g.b = (g.b + 1) % BROKERS.length; reconnect(); return commit(true);
      case 'reset':
        if (!confirm('Alle scores en antwoorden wissen? De spelers blijven ingelogd.')) return;
        H.g = Object.assign(newGame(g.room), { b: g.b, players: g.players, gone: g.gone, seq: g.seq, nTeams: g.nTeams, teams: g.teams });
        return commit(true);
      case 'newroom':
        if (!confirm('Nieuwe code maken? Iedereen moet dan opnieuw scannen.')) return;
        if (H.c && H.c.connected) H.c.publish(topic(g.room) + '/state', '', { qos: 1, retain: true });
        H.g = Object.assign(newGame(), { b: g.b });
        H.seen.clear();
        setTimeout(reconnect, 300);
        return commit(true);
      case 'clock':
        if (g.phase !== 'task' || !it || !it.time) return undefined;
        g.tEnd = Date.now() + it.time * 1000;
        return commit();
      default: return undefined;
    }
  }
