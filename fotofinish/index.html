  function saveQuiz() {
    clearTimeout(H.saveT);
    H.saveT = setTimeout(() => idb.set('quiz', H.quiz).catch(() => toast('Opslaan op deze laptop lukte niet. Bewaar het pakket als bestand.')), 300);
  }
  function editorHtml() {
    const its = items(), sel = its[H.ei];
    return `<div class="editor"><header class="ebar"><div class="brand"><span class="mark"></span>Fotofinish</div>`
      + `<input type="text" id="qtitle" value="${esc(H.quiz.title)}" aria-label="Naam van de quiz">`
      + `<button class="btn" data-act="addq">+ Vraag</button>`
      + `<button class="btn" data-act="addwine">+ Wijnronde</button>`
      + `<label class="btn" for="loadpack">Pakket laden</label><input type="file" id="loadpack" accept=".json,application/json" hidden>`
      + `<button class="btn" data-act="savepack">Pakket bewaren</button>`
      + `<button class="btn" data-act="testquiz">Testquiz</button>`
      + `<button class="btn primary" data-act="closeedit">Klaar</button></header>`
      + `<div class="ebody"><div class="elist-wrap"><label class="drop" id="drop" for="addimgs">Sleep foto's hierheen of tik om te kiezen. Elke foto wordt een nieuwe vraag.</label><input type="file" id="addimgs" accept="image/*" multiple hidden>`
      + `<ol class="elist" id="elist">${elistHtml()}</ol></div>`
      + `<section class="eform" id="eform">${sel ? formHtml(sel) : '<p class="empty-note">Nog geen vragen. Sleep foto\'s in het vak links of klik op "+ Vraag".</p>'}</section></div></div>`;
  }
  function elistHtml() {
    return items().map((it, i) => `<li class="${i === H.ei ? 'on' : ''}" data-pick="${i}"><span class="n">${i + 1}</span><span class="th" style="${it.img ? `background-image:url('${it.img}')` : ''}"></span>`
      + `<span class="t"><small class="${playable(it) ? '' : 'bad'}">${TYPES[it.type]}${playable(it) ? '' : ' · onvolledig'}${it.dbl ? ' · ×2' : ''}</small><span>${esc(it.title || it.text || '(nog geen tekst)')}</span></span>`
      + `<span class="ops"><button data-up="${i}" title="Omhoog" aria-label="Omhoog">↑</button><button data-down="${i}" title="Omlaag" aria-label="Omlaag">↓</button><button data-del="${i}" title="Verwijderen" aria-label="Verwijderen">✕</button></span></li>`).join('');
  }
  function formHtml(it) {
    const t = it.type, z = it.zoom;
    let h = `<div class="two"><div class="field"><label for="f-type">Soort</label><select id="f-type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
    if (t !== 'title' && t !== 'darts') h += `<div class="field"><label for="f-time">Seconden</label><input type="number" id="f-time" min="5" max="180" value="${it.time}"></div>`;
    if (t === 'darts') h += `<div class="field"><label for="f-mult">Punten per pijl ×</label><input type="number" id="f-mult" min="1" max="100" value="${it.mult}"></div>`;
    h += `</div>`;
    if (t === 'title') h += `<div class="field"><label for="f-title">Titel</label><input type="text" id="f-title" value="${esc(it.title)}" maxlength="80"></div>`;
    h += `<div class="field"><label for="f-text">${t === 'title' ? 'Ondertitel' : t === 'darts' ? 'Uitleg' : 'Vraag'}</label><textarea id="f-text" maxlength="260">${esc(it.text)}</textarea></div>`;
    if (t === 'mc') {
      h += `<div class="field"><span class="lbl">Antwoorden (vink het juiste aan)</span><div class="opts">${[0, 1, 2, 3].map(i => `<div class="opt"><input type="radio" name="f-ok" id="f-ok${i}" value="${i}" ${it.correct === i ? 'checked' : ''} aria-label="Antwoord ${i + 1} is juist"><span class="sw t${i}">${SHAPES[i]}</span><input type="text" id="f-o${i}" value="${esc(it.options[i])}" maxlength="90" placeholder="${i < 2 ? 'Antwoord' : 'Antwoord (mag leeg)'}"></div>`).join('')}</div></div>`;
    }
    if (t === 'num') h += `<div class="two"><div class="field"><label for="f-num">Juiste getal</label><input type="number" id="f-num" step="any" value="${it.correct ?? ''}"></div><div class="field"><label for="f-unit">Eenheid (mag leeg)</label><input type="text" id="f-unit" value="${esc(it.unit)}" maxlength="16" placeholder="bv. euro"></div></div>`;
    if (t === 'dart') h += `<p class="hintline">Iedereen voorspelt op zijn gsm. Daarna gooit iemand 3 pijlen op het echte bord en klik jij ze aan op het scherm. Wie het dichtst zit, wint.</p>`;
    if (t === 'darts') h += `<p class="hintline">Geen gsm nodig. Wie gooit, gooit op het echte bord. Jij kiest op het scherm wie het was en klikt waar de pijl zit. Zo kan de staart van het klassement terugkomen.</p>`;
    if (t !== 'title' && t !== 'darts') {
      h += `<div class="field"><span class="lbl">Foto</span><div class="row"><label class="btn" for="f-img">${it.img ? 'Andere foto' : 'Foto kiezen'}</label><input type="file" id="f-img" accept="image/*" hidden>${it.img ? `<button class="btn" data-act="rmimg">Foto weghalen</button>` : '<span class="hintline">of sleep een foto op dit vak</span>'}</div>`;
      if (it.img) {
        h += `<div class="row"><label class="check"><input type="checkbox" id="f-hide" ${it.hide ? 'checked' : ''}> Foto pas tonen bij het antwoord</label>`
          + `<label class="check"><input type="checkbox" id="f-zoom" ${z ? 'checked' : ''} ${it.hide ? 'disabled' : ''}> Uitzoomer</label>`
          + (z && !it.hide ? `<label class="check" for="f-zs">Zoom <input type="range" id="f-zs" min="2" max="12" step="0.5" value="${z.s}"> <b id="zsv" class="num">${z.s}×</b></label>` : '') + `</div>`;
        h += `<div class="pe"><div class="pe-img ${z && !it.hide ? 'zoomable' : ''}" id="pe"><img src="${esc(it.img)}" alt="">${z && !it.hide ? `<i class="cross" id="cross" style="left:${z.x}%;top:${z.y}%"></i>` : ''}</div>`
          + (z && !it.hide ? `<div class="pe-start"><div class="box" id="pebox"><img src="${esc(it.img)}" alt="" style="transform-origin:${z.x}% ${z.y}%;transform:scale(${z.s})"></div><small>Zo start de vraag. Klik op de foto links om het detail te kiezen.</small></div>` : '') + `</div>`;
      }
      h += `</div><label class="check"><input type="checkbox" id="f-dbl" ${it.dbl ? 'checked' : ''}> Dubbele punten</label>`;
    }
    return h;
  }
  function blankItem(type = 'mc') { return normItem({ type, options: ['', '', '', ''], correct: 0 }); }
  function patchList() { const l = $('#elist'); if (l) l.innerHTML = elistHtml(); }

  async function fileToDataUrl(file, max = 1600) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc);
      c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.84);
    } finally { URL.revokeObjectURL(url); }
  }
  async function addPhotos(files) {
    const imgs = [...files].filter(f => f.type.startsWith('image/'));
    if (!imgs.length) return;
    for (const f of imgs) {
      const it = blankItem('mc');
      it.img = await fileToDataUrl(f);
      items().push(it);
    }
    H.ei = items().length - imgs.length;
    saveQuiz();
    render();
    toast(imgs.length === 1 ? 'Foto toegevoegd als nieuwe vraag.' : `${imgs.length} foto's toegevoegd als nieuwe vragen.`);
  }
  async function loadPack(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.items)) throw new Error('geen quiz');
      if (H.g.idx >= 0 && !confirm('Er loopt een quiz. Scores wissen en dit pakket laden?')) return;
      H.quiz = { title: str(data.title, 80) || 'Fotofinish', items: uniqueIds(data.items.map(normItem).filter(Boolean)) };
      H.ei = 0;
      H.g = Object.assign(newGame(H.g.room), { b: H.g.b, players: H.g.players, gone: H.g.gone, seq: H.g.seq });
      store.set('ff_game', H.g);
      publish();
      await idb.set('quiz', H.quiz).catch(() => {});
      render();
      toast(`${H.quiz.items.length} vragen geladen.`);
    } catch { toast('Dit bestand is geen Fotofinish-quiz.'); }
  }
  function savePack() {
    const blob = new Blob([JSON.stringify({ app: 'fotofinish', v: 1, title: H.quiz.title, items: items() })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (H.quiz.title || 'fotofinish').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function onEditorClick(e) {
    const t = e.target, its = items();
    const pe = t.closest('#pe');
    if (pe && pe.classList.contains('zoomable')) {
      const it = its[H.ei], r = pe.getBoundingClientRect();
      it.zoom.x = +clamp((e.clientX - r.left) / r.width * 100, 0, 100).toFixed(1);
      it.zoom.y = +clamp((e.clientY - r.top) / r.height * 100, 0, 100).toFixed(1);
      $('#cross').style.left = it.zoom.x + '%';
      $('#cross').style.top = it.zoom.y + '%';
      const bi = $('#pebox img');
      if (bi) bi.style.transformOrigin = `${it.zoom.x}% ${it.zoom.y}%`;
      return saveQuiz();
    }
    const b = t.closest('[data-act],[data-pick],[data-up],[data-down],[data-del]');
    if (!b) return;
    if (b.dataset.up || b.dataset.down || b.dataset.del) {
      e.stopPropagation();
      const i = +(b.dataset.up || b.dataset.down || b.dataset.del);
      if (b.dataset.del) {
        if (!confirm(`Vraag ${i + 1} verwijderen?`)) return;
        its.splice(i, 1);
        H.ei = Math.min(H.ei, its.length - 1);
      } else {
        const j = b.dataset.up ? i - 1 : i + 1;
        if (j < 0 || j >= its.length) return;
        [its[i], its[j]] = [its[j], its[i]];
        H.ei = j;
      }
      saveQuiz();
      return render();
    }
    if (b.dataset.pick) { H.ei = +b.dataset.pick; return render(); }
    switch (b.dataset.act) {
      case 'addq': its.push(blankItem('mc')); H.ei = its.length - 1; saveQuiz(); return render();
      case 'addwine': {
        const at = its.length;
        its.push(...WINE_ROUND.map(r => normItem(r)));
        uniqueIds(its);
        H.ei = at;
        saveQuiz();
        render();
        return toast(`${WINE_ROUND.length - 1} wijnvragen toegevoegd. Schrap gerust wat je niet wil.`);
      }
      case 'savepack': return savePack();
      case 'testquiz':
        if (!confirm('De huidige quiz vervangen door de testquiz? Bewaar eerst je pakket als je het nog nodig hebt.')) return;
        H.quiz = testQuiz(); H.ei = 0; saveQuiz(); return render();
      case 'rmimg': { const it = its[H.ei]; it.img = ''; it.zoom = null; it.hide = false; saveQuiz(); return render(); }
      case 'closeedit': H.mode = 'game'; if (H.g.idx >= items().length) { H.g.idx = -1; } H.g.phase = 'lobby'; commit(false); return render(true);
      default: return undefined;
    }
  }
  function onEditorInput(e) {
    const t = e.target, it = items()[H.ei];
    if (t.id === 'qtitle') { H.quiz.title = t.value.slice(0, 80); return saveQuiz(); }
    if (!it || !t.id) return;
    if (t.id === 'f-title') it.title = t.value;
    else if (t.id === 'f-text') it.text = t.value;
    else if (t.id === 'f-time') it.time = clamp(Number(t.value) || 20, 5, 180);
    else if (t.id === 'f-mult') it.mult = clamp(Number(t.value) || 10, 1, 100);
    else if (t.id === 'f-num') it.correct = t.value === '' || !Number.isFinite(Number(t.value)) ? null : Number(t.value);
    else if (t.id === 'f-unit') it.unit = t.value.slice(0, 16);
    else if (t.id === 'f-zs' && it.zoom) {
      it.zoom.s = Number(t.value);
      $('#zsv').textContent = it.zoom.s + '×';
      const bi = $('#pebox img');
      if (bi) bi.style.transform = `scale(${it.zoom.s})`;
    } else if (t.id.startsWith('f-ok')) it.correct = Number(t.value);
    else if (t.id.startsWith('f-o')) it.options[Number(t.id.slice(3))] = t.value;
    else return;
    saveQuiz();
    patchList();
  }
  function onEditorChange(e) {
    const t = e.target, it = items()[H.ei];
    if (t.id === 'loadpack' && t.files[0]) return loadPack(t.files[0]);
    if (t.id === 'addimgs' && t.files.length) return addPhotos(t.files);
    if (!it) return;
    if (t.id === 'f-img' && t.files[0]) {
      return fileToDataUrl(t.files[0]).then(d => { it.img = d; saveQuiz(); render(); }).catch(() => toast('Deze foto kon ik niet openen.'));
    }
    if (t.id === 'f-type') { const keep = it.options; Object.assign(it, normItem({ ...it, type: t.value, time: DEF_TIME[t.value] || it.time, correct: t.value === 'mc' ? 0 : null }), { id: it.id, options: keep }); }
    else if (t.id === 'f-dbl') it.dbl = t.checked;
    else if (t.id === 'f-hide') { it.hide = t.checked; }
    else if (t.id === 'f-zoom') it.zoom = t.checked ? (it.zoom || { x: 50, y: 50, s: 6 }) : null;
    else return;
    saveQuiz();
    render();
  }
  function onDrag(e) {
    if (H.mode !== 'editor') return;
    e.preventDefault();
    const zone = e.target.closest('#drop, #eform');
    $$('.over').forEach(el => el !== zone && el.classList.remove('over'));
    if (zone) zone.classList.toggle('over', e.type === 'dragover');
  }
  function onDrop(e) {
    if (H.mode !== 'editor') return;
    e.preventDefault();
    $$('.over').forEach(el => el.classList.remove('over'));
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    const it = items()[H.ei];
    if (e.target.closest('#eform') && it && it.type !== 'title' && it.type !== 'darts' && files[0].type.startsWith('image/')) {
      fileToDataUrl(files[0]).then(d => { it.img = d; saveQuiz(); render(); });
    } else addPhotos(files);
  }

  // ════════════════════════════════════════════════════════════
  //  SPELER (gsm)
  // ════════════════════════════════════════════════════════════
  const P = { room: '', pid: '', name: '', c: null, st: null, at: 0, link: 'off', key: '', mine: {}, lastJoin: 0, lastResend: 0 };
  const me = () => (P.st && P.st.pl ? P.st.pl[P.pid] : null);

  function playerBoot(room) {
    P.room = room.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    P.pid = store.get('ff_pid', '');
    if (!/^[a-z0-9]{6,20}$/.test(P.pid)) { P.pid = rnd(12, ID_ABC); store.set('ff_pid', P.pid); }
    P.name = store.get('ff_name_' + P.room, '');
    P.mine = store.get('ff_mine_' + P.room, {});
    P.c = openLink({
      url: brokerUrl(Number(params.get('b')) || 0),
      subs: [topic(P.room) + '/state'],
      onMsg: (t, m) => { if (!m || typeof m.ph !== 'string') return; P.st = m; P.at = Date.now(); pRender(); pSync(); },
      onState: s => { P.link = s; const d = $('#plink'); if (d) d.className = 'dot ' + s; if (s === 'nolib') pRender(); },
      onUp: () => { if (P.name) sendJoin(); },
    });
    app.addEventListener('click', onPlayerClick);
    app.addEventListener('submit', onPlayerSubmit);
    setInterval(pTick, 250);
    pRender();
  }
  function send(m) {
    if (P.c && P.c.connected) P.c.publish(topic(P.room) + '/up/' + P.pid, JSON.stringify(m), { qos: 1 });
  }
  function sendJoin() { P.lastJoin = Date.now(); send({ t: 'join', n: P.name }); }
  // Stuur opnieuw als de quizmaster iets nog niet bevestigde (verloren berichten)
  function pSync() {
    const st = P.st, m = me();
    if (!st || !P.name) return;
    if ((!m || m.n !== P.name) && Date.now() - P.lastJoin > 2500) sendJoin();
    const q = st.q;
    if (st.ph === 'question' && q && P.mine[q.id] != null && m && !m.a && Date.now() - P.lastResend > 2500) {
      P.lastResend = Date.now();
      send({ t: 'ans', q: q.id, v: P.mine[q.id] });
    }
  }
  const timeLeft = () => (P.st && P.st.ph === 'question' ? P.st.left - (Date.now() - P.at) : 0);
  function pTick() {
    const st = P.st;
    if (st && st.ph === 'question') {
      const left = timeLeft(), bar = $('#ptbar');
      if (bar) bar.style.width = clamp(left / st.dur * 100, 0, 100) + '%';
      const btns = $('.pbtns');
      if (btns && left <= 0 && !btns.classList.contains('closed')) {
        btns.classList.add('closed');
        $$('button', btns).forEach(b => { b.disabled = true; });
        const f = $('.pform button');
        if (f) f.disabled = true;
      }
    }
    pSync();
  }
  function pRender() {
    const st = P.st, m = me(), q = st && st.q;
    let key;
    if (P.link === 'nolib') key = 'nolib';
    else if (!P.name) key = 'join';
    else if (!st) key = 'connecting';
    else if (!m) key = 'joining';
    else {
      key = [st.ph, q ? q.id : '', st.ph === 'question' && q ? (P.mine[q.id] != null ? 'done' : 'open') : '',
        ['reveal', 'board', 'darts', 'end'].includes(st.ph) ? `${m.d}:${m.r}:${m.s}` : ''].join('|');
    }
    if (key === P.key) return pPatch();
    P.key = key;
    app.innerHTML = `<div class="phone">${pBar()}<main class="pmain">${pMain()}</main></div>`;
    const f = $('#pnum') || (!P.name && $('#pname'));
    if (f && !('ontouchstart' in window && f.id === 'pname')) f.focus();
  }
  function pBar() {
    const m = me();
    return `<header class="pbar"><span class="brand"><span class="mark"></span>Fotofinish</span><span class="me">${m ? esc(m.n) : ''}<small class="num">${m ? `${fmt(m.s)} pt · ${m.r}e` : 'code ' + esc(P.room)}</small></span><span class="dot ${P.link}" id="plink"></span></header>`;
  }
  function pPatch() {
    const h = $('.pbar');
    if (h) h.outerHTML = pBar();
    const pn = $('#pn');
    if (pn && P.st) pn.textContent = Object.keys(P.st.pl || {}).length;
  }
  const center = (title, sub, cls = '') => `<h1 class="pbig ${cls}">${title}</h1>${sub ? `<p class="psub">${sub}</p>` : ''}`;
  function pMain() {
    const st = P.st, m = me();
    if (P.link === 'nolib') return center('Geen verbinding', 'Deze gsm raakt niet aan de quiz. Kijk of je internet hebt en laad de pagina opnieuw.');
    if (!P.name) {
      return `<form class="pjoin" id="joinform"><h1 class="pbig">Doe mee</h1><p class="psub">Code <b>${esc(P.room)}</b>. Kies een naam die iedereen herkent.</p>`
        + `<input type="text" id="pname" maxlength="18" autocomplete="nickname" placeholder="Jouw naam" value="${esc(store.get('ff_lastname', ''))}" required>`
        + `<button class="btn primary big">Doe mee</button></form>`;
    }
    if (!st) return center('Verbinden…', `We zoeken de quiz met code <b>${esc(P.room)}</b>. Staat de lobby open op de beamer?`);
    if (!m) return center('Aanmelden…', `Even geduld, ${esc(P.name)}.`) + `<button class="linkbtn" data-act="rename">Andere naam</button>`;
    const q = st.q;
    switch (st.ph) {
      case 'lobby': return center('Je zit erin', `Kijk naar het grote scherm. <b id="pn" class="num">${Object.keys(st.pl).length}</b> spelers binnen.`) + `<button class="linkbtn" data-act="rename">Naam aanpassen</button>`;
      case 'title': return center(esc(q.ti || q.tx), q.ti ? esc(q.tx) : '');
      case 'question': return pQuestion(q);
      case 'throw': return center('De pijlen vliegen', `Kijk naar het dartbord. Jouw gok: <b class="num">${P.mine[q.id] != null ? fmt(P.mine[q.id]) : 'geen'}</b>`);
      case 'reveal': return pReveal(st, q, m);
      case 'board': return pBoard(st, m);
      case 'darts': return center('Pijlronde', m.d ? `Jij scoorde <b class="num">+${fmt(m.d)}</b>.` : 'Kijk naar het bord.');
      case 'end': return center(`${m.r}e plaats`, `Van de ${Object.keys(st.pl).length} spelers, met <b class="num">${fmt(m.s)}</b> punten. ${m.r === 1 ? 'Proficiat, kampioen!' : 'Bedankt om mee te spelen.'}`, 'plain');
      default: return center('Even wachten', '');
    }
  }
  function pQuestion(q) {
    const mine = P.mine[q.id];
    const head = `<p class="pmeta">${TYPES[q.t]}${q.dbl ? ' · dubbele punten' : ''}</p><p class="pq">${esc(q.tx)}</p><div class="ptimer"><i id="ptbar"></i></div>`;
    if (mine != null) {
      return head + `<div class="psent ${q.t === 'mc' ? 't' + mine : ''}">${q.t === 'mc' ? `<span class="shape">${SHAPES[mine]}</span><b>${esc(q.o[mine])}</b>` : `<b class="num">${fmt(mine)}${q.u ? ' ' + esc(q.u) : ''}</b>`}<small>Verstuurd. Wacht op de rest.</small></div>`;
    }
    if (q.t === 'mc') return head + `<div class="pbtns">${q.o.map((o, i) => `<button class="t${i}" data-ans="${i}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    return head + `<form class="pform" id="numform"><input type="number" id="pnum" inputmode="decimal" step="any" required autocomplete="off" placeholder="${q.t === 'dart' ? 'bv. 60' : 'jouw gok'}" aria-label="Jouw antwoord"><button class="btn primary big">Verstuur</button></form>`;
  }
  function pReveal(st, q, m) {
    const mine = P.mine[q.id], answered = mine != null, pts = m.d || 0;
    const right = q.t === 'mc' ? `${SHAPES[st.ok]} ${esc(q.o[st.ok])}` : fmt(st.ok) + (q.u ? ' ' + esc(q.u) : '');
    let cls, title;
    if (!answered && !pts) { cls = 'neutral'; title = 'Geen antwoord'; }
    else if (q.t === 'mc') { cls = m.k ? 'ok' : 'no'; title = m.k ? 'Juist!' : 'Mis'; }
    else { cls = m.k ? 'ok' : pts >= 400 ? 'neutral' : 'no'; title = m.k ? 'Dichtste gok!' : pts >= 400 ? 'Dichtbij' : 'Ver naast'; }
    return `<div class="pres ${cls}"><span class="ptitle">${title}</span><span class="pts num">+${fmt(pts)}</span><span>Antwoord: <b>${right}</b>${q.t !== 'mc' && answered ? ` · jij: ${fmt(mine)}` : ''}</span></div>`
      + `<p class="psub">Je staat <b>${m.r}e</b> met <b class="num">${fmt(m.s)}</b> punten.</p>`;
  }
  function pBoard(st, m) {
    const ahead = Object.values(st.pl).filter(p => p.s > m.s).sort((a, b) => a.s - b.s)[0];
    const sub = m.r === 1 ? `Je staat aan de leiding met <b class="num">${fmt(m.s)}</b> punten.` : `<b class="num">${fmt(m.s)}</b> punten. Nog <b class="num">${fmt(ahead.s - m.s)}</b> tot ${esc(ahead.n)}.`;
    return center(`${m.r}e`, sub, 'plain');
  }
  function answer(v) {
    const st = P.st, q = st && st.q;
    if (!q || st.ph !== 'question' || P.mine[q.id] != null) return;
    if (timeLeft() <= 0) return toast('De tijd is om.');
    P.mine[q.id] = v;
    store.set('ff_mine_' + P.room, P.mine);
    P.lastResend = Date.now();
    send({ t: 'ans', q: q.id, v });
    if (navigator.vibrate) navigator.vibrate(30);
    pRender();
  }
  function onPlayerClick(e) {
    const b = e.target.closest('[data-ans],[data-act]');
    if (!b) return;
    if (b.dataset.ans != null) return answer(Number(b.dataset.ans));
    if (b.dataset.act === 'rename') { P.name = ''; P.key = ''; pRender(); }
  }
  function onPlayerSubmit(e) {
    e.preventDefault();
    if (e.target.id === 'joinform') {
      const n = cleanName($('#pname').value);
      if (!n) return;
      P.name = n;
      store.set('ff_name_' + P.room, n);
      store.set('ff_lastname', n);
      sendJoin();
      P.key = '';
      pRender();
    } else if (e.target.id === 'numform') {
      const raw = $('#pnum').value.replace(',', '.');
      const v = Number(raw);
      if (raw.trim() === '' || !Number.isFinite(v)) return toast('Typ een getal.');
      answer(v);
    }
  }

  // ════════════════════════════════════════════════════════════
  //  STARTSCHERM
  // ════════════════════════════════════════════════════════════
  function landing() {
    const extra = customBroker ? '&broker=' + encodeURIComponent(customBroker) : '';
    app.innerHTML = `<div class="landing"><div class="brand"><span class="mark"></span>Fotofinish</div>`
      + `<p class="lede">De quiz van vandaag, met de foto's van vandaag. De quizmaster speelt op de beamer, iedereen anders op zijn gsm.</p>`
      + `<form id="codeform"><label for="code">Meespelen? Typ de code van het scherm.</label><input type="text" id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="K7QX9" required><button class="btn primary big">Doe mee</button></form>`
      + `<a class="btn" href="?host${extra}">Ik ben de quizmaster (laptop aan de beamer)</a></div>`;
    $('#codeform').addEventListener('submit', e => {
      e.preventDefault();
      const c = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c) location.search = '?r=' + c + extra;
    });
  }

  if (params.has('host')) hostBoot();
  else if (params.get('r')) playerBoot(params.get('r'));
  else landing();
})();
</script>
</body>
</html>
